{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="nas-icon">
{% if name == 'arrow' %}<path d="M5 12h14m-6-6 6 6-6 6"/>
{% elif name == 'external' %}<path d="M7 17 17 7M7 7h10v10"/>
{% elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
{% elif name == 'moon' %}<path d="M20.5 13.4A8.5 8.5 0 0 1 10.6 3.5 8.5 8.5 0 1 0 20.5 13.4Z"/>
{% elif name == 'monitor' %}<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>
{% elif name == 'menu' %}<path d="M4 8h16M4 16h16"/>
{% elif name == 'chevron' %}<path d="m8 10 4 4 4-4"/>
{% elif name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'users' %}<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
{% elif name == 'table' %}<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 9v12"/>
{% elif name == 'chart' %}<path d="M3 3v18h18M7 14l4-4 4 3 5-7"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'book' %}<path d="M12 5v16M3 3c4-1 6 0 9 2 3-2 5-3 9-2v16c-4-1-6 0-9 2-3-2-5-3-9-2Z"/>
{% elif name == 'layers' %}<path d="m12 3 10 6-10 6L2 9Zm-9 11 9 6 9-6M3 18l9 5 9-5"/>
{% elif name == 'leaf' %}<path d="M20 3C9 1 2 9 5 16s16 5 15-13ZM5 19l10-10M9 15v-5m0 5h5"/>
{% elif name == 'logout' %}<path d="M9 4H4v16h5m6-13 5 5-5 5M8 12h12"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>
{% elif name == 'download' %}<path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/>
{% elif name == 'sort' %}<path d="m8 8 4-4 4 4m-8 8 4 4 4-4M12 4v16"/>
{% elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>
{% endif %}</svg>
{%- endmacro %}
